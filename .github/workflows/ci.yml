name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  RAILS_ENV: test

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec spec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  yard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec yard-lint

  appraisal:
    runs-on: ubuntu-latest
    env:
      # appraisal2 defaults to 2 parallel workers, but every appraisal gemfile
      # shares the same BUNDLE_PATH (vendor/bundle) and test/dummy sqlite3 db,
      # so concurrent installs/specs stall on Bundler's install-path lock.
      APPRAISAL_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # TEMPORARY: appraisal2's own "bundle check || bundle install" wrapper
      # dies silently on this runner with no error text, so run the same
      # install directly and verbosely to surface the real failure.
      - name: Debug bundler environment
        run: |
          bundle env
          echo "--- direct verbose install: rails_8_1 ---"
          BUNDLE_GEMFILE=gemfiles/rails_8_1.gemfile bundle install --gemfile=gemfiles/rails_8_1.gemfile --verbose
      - run: bundle exec appraisal install
      - run: bundle exec appraisal rspec
