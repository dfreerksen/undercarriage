name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  RAILS_ENV: test

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec spec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  yard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec yard-lint

  appraisal:
    runs-on: ubuntu-latest
    env:
      # appraisal2 defaults to 2 parallel workers, but every appraisal gemfile
      # shares the same BUNDLE_PATH (vendor/bundle) and test/dummy sqlite3 db,
      # so concurrent installs/specs stall on Bundler's install-path lock.
      APPRAISAL_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # appraisal2 runs each appraisal's "bundle check || bundle install" in a
      # scrubbed subprocess env (see appraisal/command.rb#bundler_env). On a
      # cold vendor/bundle cache, its own "is bundler available" probe reports
      # success without actually registering the pinned Gemfile.lock version
      # (4.0.15) as an installed gem in that subprocess env, so the first
      # appraisal's install dies silently. Explicitly installing it once here,
      # outside appraisal's subprocess wrapping, avoids that.
      - run: gem install bundler -v "$(bundle -v | grep -oE '[0-9.]+$')" --no-document
      - run: bundle exec appraisal install
      - run: bundle exec appraisal rspec
