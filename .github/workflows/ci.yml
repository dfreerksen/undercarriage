name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  RAILS_ENV: test

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec spec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  yard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec yard-lint

  appraisal:
    runs-on: ubuntu-latest
    env:
      # appraisal2 defaults to 2 parallel workers, but every appraisal gemfile
      # shares the same BUNDLE_PATH (vendor/bundle) and test/dummy sqlite3 db,
      # so concurrent installs/specs stall on Bundler's install-path lock.
      APPRAISAL_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # bundler-cache leaves BUNDLE_PATH set to the relative "vendor/bundle" in
      # .bundle/config. Bundler resolves a relative BUNDLE_PATH against the
      # active Gemfile's directory, so appraisal's gemfiles (under gemfiles/)
      # would install into gemfiles/vendor/bundle instead of the cached path.
      - run: bundle config set --local path "${{ github.workspace }}/vendor/bundle"
      - run: bundle exec appraisal install
      - run: bundle exec appraisal rspec
